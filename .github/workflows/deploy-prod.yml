name: Production deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: devnogi/ci-workflows/.github/workflows/spring-prod.yml@a60862fc2e2a5117c85efc1c6bd6b4033a82b3d9
    with:
      service-profile: auth-mysql
      deployment-target: prod2
      service-name: auth
      dockerfile: Dockerfile
      compose-file: docker-compose-auth-prod.yml
      health-timeout: '300'
      platform: linux/amd64
    secrets: inherit
