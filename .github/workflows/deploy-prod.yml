name: Production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auth-production
  cancel-in-progress: false

jobs:
  workflow-contract:
    name: workflow-contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify workflow contract
        run: node --test scripts/workflow-contract.test.mjs

  production:
    needs: workflow-contract
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: devnogi/ci-workflows/.github/workflows/spring-prod.yml@c5b33bfa84762986d47037f5ce3eca14a1c516ca
    with:
      service-profile: auth-mysql
      deployment-target: prod2
      service-name: auth
      dockerfile: Dockerfile
      compose-file: docker-compose-auth-prod.yml
      health-timeout: '300'
      platform: linux/amd64
    secrets: inherit
