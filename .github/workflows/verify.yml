name: Service verification
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: devnogi/ci-workflows/.github/workflows/spring-ci.yml@9506ea4c4dd3147e3ab15a8b06e780ce416908a6
    with:
      service-profile: auth-mysql
      image-name: devnogi-auth-server
      dockerfile: Dockerfile
      compose-file: docker-compose-auth-prod.yml
