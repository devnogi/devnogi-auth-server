name: Service verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0.42
        env:
          MYSQL_ROOT_PASSWORD: synthetic-nickname-test-only
          MYSQL_DATABASE: auth
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=synthetic-nickname-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
      token-migration-mysql:
        image: mysql:8.0.42
        env:
          MYSQL_ROOT_PASSWORD: synthetic-token-migration-only
          MYSQL_DATABASE: auth
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=synthetic-token-migration-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
      flyway-main-mysql:
        image: mysql:8.0.42
        env:
          MYSQL_ROOT_PASSWORD: synthetic-flyway-only
          MYSQL_DATABASE: devnogi
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=synthetic-flyway-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
      flyway-fresh-mysql:
        image: mysql:8.0.42
        env:
          MYSQL_ROOT_PASSWORD: synthetic-flyway-only
          MYSQL_DATABASE: auth
        ports:
          - 3309:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=synthetic-flyway-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew verify --no-daemon
      - name: Verify refresh token schema upgrade on isolated MySQL 8.0.42
        run: ./gradlew test --tests '*RefreshTokenMigrationMySqlTest' --rerun-tasks --no-daemon
        env:
          TOKEN_MIGRATION_MYSQL_URL: jdbc:mysql://127.0.0.1:3307/auth?useSSL=false&allowPublicKeyRetrieval=true
          TOKEN_MIGRATION_MYSQL_USER: root
          TOKEN_MIGRATION_MYSQL_PASSWORD: synthetic-token-migration-only
          TOKEN_MIGRATION_MYSQL_REQUIRED: 'true'
      - name: Verify exact main Flyway history and fresh auth baseline on isolated MySQL 8.0.42
        run: ./gradlew test --tests '*MainHistoryCompatibilityMySqlTest' --rerun-tasks --no-daemon
        env:
          FLYWAY_MAIN_MYSQL_URL: jdbc:mysql://127.0.0.1:3308/devnogi?useSSL=false&allowPublicKeyRetrieval=true
          FLYWAY_FRESH_MYSQL_URL: jdbc:mysql://127.0.0.1:3309/auth?useSSL=false&allowPublicKeyRetrieval=true
          FLYWAY_MYSQL_USER: root
          FLYWAY_MYSQL_PASSWORD: synthetic-flyway-only
          FLYWAY_MYSQL_REQUIRED: 'true'
      - name: Verify nickname migration on MySQL 8.0.42
        run: ./gradlew test --tests '*NicknameMigrationMySqlTest' --rerun-tasks --no-daemon
        env:
          NICKNAME_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/auth?useSSL=false&allowPublicKeyRetrieval=true
          NICKNAME_MYSQL_USER: root
          NICKNAME_MYSQL_PASSWORD: synthetic-nickname-test-only
          NICKNAME_MYSQL_REQUIRED: 'true'
      - name: Verify nickname and game identity concurrency on MySQL 8.0.42
        run: ./gradlew test --tests '*NicknameConcurrencyMySqlTest' --rerun-tasks --no-daemon
        env:
          NICKNAME_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/auth?useSSL=false&allowPublicKeyRetrieval=true
          NICKNAME_MYSQL_USER: root
          NICKNAME_MYSQL_PASSWORD: synthetic-nickname-test-only
          NICKNAME_MYSQL_REQUIRED: 'true'
      - name: Verify single-use game proof and token issuance races on MySQL 8.0.42
        run: ./gradlew test --tests '*UserVerificationConcurrencyMySqlTest' --rerun-tasks --no-daemon
        env:
          NICKNAME_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/auth?useSSL=false&allowPublicKeyRetrieval=true
          NICKNAME_MYSQL_USER: root
          NICKNAME_MYSQL_PASSWORD: synthetic-nickname-test-only
          NICKNAME_MYSQL_REQUIRED: 'true'
      - name: Verify OAuth exchange migration and one-time proof on MySQL 8.0.42
        run: ./gradlew test --tests '*OAuthExchangeMySqlTest' --tests '*SocialSignupProofMySqlTest' --rerun-tasks --no-daemon
        env:
          NICKNAME_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/auth?useSSL=false&allowPublicKeyRetrieval=true
          NICKNAME_MYSQL_USER: root
          NICKNAME_MYSQL_PASSWORD: synthetic-nickname-test-only
          NICKNAME_MYSQL_REQUIRED: 'true'
      - name: Verify refresh rotation and failure history on MySQL 8.0.42
        run: ./gradlew test --tests '*RefreshTokenRotationMySqlTest' --tests '*RefreshTokenLengthMySqlTest' --tests '*ConcurrentLoginMySqlTest' --tests '*UserVerificationFailureHistoryMySqlTest' --tests '*LoginLockoutMySqlTest' --rerun-tasks --no-daemon
        env:
          NICKNAME_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/auth?useSSL=false&allowPublicKeyRetrieval=true
          NICKNAME_MYSQL_USER: root
          NICKNAME_MYSQL_PASSWORD: synthetic-nickname-test-only
          NICKNAME_MYSQL_REQUIRED: 'true'
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production deployment guards
        run: node --test scripts/test-deploy-prod-workflow.mjs scripts/test-deploy-prod-behavior.mjs
      - run: node scripts/secret-scan.mjs
