name: Service verification
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: devnogi/ci-workflows/.github/workflows/spring-ci.yml@5c46d7aff8ce452b72ad8f6c18bcb5a09828384d
    with:
      service-profile: auth-mysql
      service-name: auth
      dockerfile: Dockerfile
      compose-file: docker-compose-auth-prod.yml
