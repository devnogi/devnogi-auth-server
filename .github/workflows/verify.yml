name: Service verification
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: devnogi/ci-workflows/.github/workflows/spring-ci.yml@a60862fc2e2a5117c85efc1c6bd6b4033a82b3d9
    with:
      service-profile: auth-mysql
      service-name: auth
      dockerfile: Dockerfile
      compose-file: docker-compose-auth-prod.yml
