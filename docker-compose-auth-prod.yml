services:
  auth-server:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    container_name: auth-server
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.prod}
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    deploy:
      resources:
        limits:
          memory: 750M
    restart: always
    logging:
      driver: "syslog"
      options:
        syslog-address: "unixgram:///dev/log"
        syslog-format: "rfc5424micro"
        tag: "memonogi-auth"
        mode: "non-blocking"
        max-buffer-size: "4m"
        cache-disabled: "false"
        cache-max-size: "20m"
        cache-max-file: "5"
    networks:
      - infra_devnogi-network

networks:
  infra_devnogi-network:
    external: true
