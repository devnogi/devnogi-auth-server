server:
  port: ${SERVER_PORT}
  address: 0.0.0.0
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: [ "health", "metrics" ]
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

spring:
  application:
    name: devnogi-auth-server
  web:
    resources:
      static-locations: classpath:/static/
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_SCHEMA}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${BASE_URL}/login/oauth2/code/google
            scope: [ openid, email ]

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${BASE_URL}/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: [ account_email ]

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: ${BASE_URL}/login/oauth2/code/naver
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: [ email ]

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 값을 JSON 형태로 보내기 위한 설정
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:devnogi-auth-user-verification-consumer}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  resources:
    static-locations: classpath:/static/
  mvc:
    contentnegotiation:
      # URL 확장자에 의한 컨텐트 타입 결정
      favor-path-extension: true
      # Accept 헤더 무시
      ignore-accept-header: true
  docker:
    compose:
      enabled: false
  cloud:
    aws:
      region:
        static: ${AWS_REGION}
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      s3:
        endpoint: ${MINIO_ENDPOINT}
        path-style-access-enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:3600} # milliseconds; legacy fallback preserved
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:86400} # milliseconds; legacy fallback preserved
  issuer: devnogi
  access-token-cookie-name: access_token
  refresh-token-cookie-name: refresh_token
  cookie-domain: ${JWT_COOKIE_DOMAIN:.memonogi.com}
  cookie-secure: ${JWT_COOKIE_SECURE:true}
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:None}


springdoc:
  swagger-ui:
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
    classification:
      readyToUseGroupName: 개발 완료 API
      workInProgressGroupName: 개발 진행중 API
      deprecatedGroupName: 더이상 유지보수되지 않는 API

decorator:
  datasource:
    p6spy:
      enable-logging: false

app:
  search:
    cache-key: ${USER_SEARCH_CACHE_KEY:auth:total-search:user-snapshot:v1}
    ttl: ${USER_SEARCH_CACHE_TTL:PT24H}
    refresh-cron: ${USER_SEARCH_REFRESH_CRON:0 0 * * * *}
    warmup-enabled: ${USER_SEARCH_WARMUP_ENABLED:true}
  oauth:
    redirect-uri: ${OAUTH_FRONTEND_CALLBACK_URL:https://www.memonogi.com/social-callback}
    code-validity-seconds: ${OAUTH_CODE_VALIDITY_SECONDS:300}
    proof-validity-seconds: ${OAUTH_PROOF_VALIDITY_SECONDS:300}
    cleanup-interval-ms: ${OAUTH_CLEANUP_INTERVAL_MS:600000}
  nickname:
    ticket-secret: ${NICKNAME_TICKET_SECRET}
    ticket-validity-seconds: ${NICKNAME_TICKET_VALIDITY_SECONDS:600}
    enforce-issued-candidates: ${NICKNAME_ENFORCE_ISSUED_CANDIDATES:true}
  verification:
    prefix: ${USER_VERIFICATION_PREFIX:메모노기_}
    length: ${USER_VERIFICATION_LENGTH:20}
    validity-minutes: ${USER_VERIFICATION_VALIDITY_MINUTES:60}
    cooldown-days: ${USER_VERIFICATION_COOLDOWN_DAYS:7}
    hash-secret: ${USER_VERIFICATION_HASH_SECRET:change-this-secret}
  kafka:
    topics:
      user-verification-verify: ${KAFKA_TOPIC_USER_VERIFICATION_VERIFY:USER_VERIFICATION_VERIFY_EVENT}
  user-info-outbox:
    poll-interval-ms: ${USER_INFO_OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${USER_INFO_OUTBOX_BATCH_SIZE:50}
    lease-duration: ${USER_INFO_OUTBOX_LEASE_DURATION:PT1M}
    base-backoff: ${USER_INFO_OUTBOX_BASE_BACKOFF:PT5S}
    max-backoff: ${USER_INFO_OUTBOX_MAX_BACKOFF:PT10M}
    backfill-enabled: ${USER_INFO_OUTBOX_BACKFILL_ENABLED:false}
    backfill-batch-size: ${USER_INFO_OUTBOX_BACKFILL_BATCH_SIZE:100}
    backfill-interval-ms: ${USER_INFO_OUTBOX_BACKFILL_INTERVAL_MS:60000}
    observation:
      interval-ms: ${USER_INFO_OUTBOX_OBSERVATION_INTERVAL_MS:30000}
      warn-pending-count: ${USER_INFO_OUTBOX_WARN_PENDING_COUNT:100}
      error-pending-count: ${USER_INFO_OUTBOX_ERROR_PENDING_COUNT:1000}
      warn-oldest-age-seconds: ${USER_INFO_OUTBOX_WARN_OLDEST_AGE_SECONDS:300}
      error-oldest-age-seconds: ${USER_INFO_OUTBOX_ERROR_OLDEST_AGE_SECONDS:1800}
      warn-max-attempts: ${USER_INFO_OUTBOX_WARN_MAX_ATTEMPTS:3}
      error-max-attempts: ${USER_INFO_OUTBOX_ERROR_MAX_ATTEMPTS:10}

---
spring:
  config:
    activate:
      on-profile: default

decorator:
  datasource:
    p6spy:
      enable-logging: false

logging:
  level:
    until.the.eternity: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    until.the.eternity: INFO
    org.springframework.security: WARN
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
    org.hibernate: WARN
